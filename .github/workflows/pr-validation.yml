name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (no push)
        run: docker buildx build --platform linux/amd64 --load -t hajimi-pr-validation:latest .
